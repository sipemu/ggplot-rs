[package]
name = "ggplot-rs-wasm"
version = "0.17.1"
edition = "2021"
description = "Browser (wasm-bindgen) bindings for ggplot-rs: JSON spec in, SVG / RGBA out"
authors = ["Simon Müller <sm@data-zoo.de>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sipemu/ggplot-rs"
# Built with wasm-pack for the browser demo (web/); not published to crates.io.
publish = false

# A cdylib only: this is the crate wasm-pack turns into a `.wasm` module. The
# library crate `ggplot-rs` itself stays a plain rlib, so downstream static /
# side-module builds (e.g. emscripten) don't trip over a cdylib target.
[lib]
crate-type = ["cdylib"]

[dependencies]
# Plotters-free: the bindings drive the self-contained SvgBackend (and the
# raster PixelBackend with `canvas`).
ggplot-rs = { path = "../..", default-features = false, features = ["sf"] }
wasm-bindgen = "0.2"
serde_json = "1"

[features]
# The raster scatter/linked-views exports (`render_scatter_rgba`,
# `render_scatter_xy`) use ggplot-rs' `canvas` backend.
default = ["canvas"]
canvas = ["ggplot-rs/canvas"]
