[package]
name = "ggplot-rs-wasm"
version = "0.35.1"
edition = "2021"
description = "Browser (wasm-bindgen) bindings for ggplot-rs: JSON spec in, SVG / RGBA out"
authors = ["Simon Müller <sm@data-zoo.de>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sipemu/ggplot-rs"
# Built with wasm-pack into the npm package `@sipemu/ggplot-rs` (js/) and the
# browser demo (web/); not published to crates.io.
publish = false

# The cdylib is what wasm-pack turns into a `.wasm` module (the rlib only lets
# `tests/web.rs` link against it). The library crate `ggplot-rs` itself stays a
# plain rlib, so downstream static / side-module builds (e.g. emscripten) don't
# trip over a cdylib target.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Plotters-free: the bindings drive the self-contained SvgBackend (and the
# raster PixelBackend with `canvas`).
ggplot-rs = { path = "../..", default-features = false, features = ["sf", "serde"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
# The raster scatter/linked-views exports (`render_scatter_rgba`,
# `render_scatter_xy`) use ggplot-rs' `canvas` backend.
default = ["canvas"]
canvas = ["ggplot-rs/canvas"]
